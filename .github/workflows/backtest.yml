name: Backtest cronologico pronostici

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/backtest_walk_forward.py"
      - "tests/test_backtest.py"
      - ".github/workflows/backtest.yml"
  schedule:
    - cron: "37 4 * * 0"

permissions:
  contents: write

concurrency:
  group: backtest-pronostici
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sincronizza con main aggiornato
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Verifica la sintassi del modello
        run: python -m py_compile scripts/update_predictions.py scripts/backtest_walk_forward.py
      - name: Verifica i test locali del backtest
        run: python -m unittest discover -s tests -p 'test_backtest.py' -v
      - name: Esegue il backtest walk-forward
        run: python scripts/backtest_walk_forward.py
      - name: Pubblica il report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/backtest_report.json /tmp/backtest_report.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/backtest_report.json data/backtest_report.json
            git add data/backtest_report.json
            if git diff --cached --quiet; then
              echo "Report invariato."
              exit 0
            fi
            git commit -m "Aggiorna report backtest cronologico"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push concorrente: riprovo da main aggiornato."
          done
          echo "Impossibile pubblicare il report dopo tre tentativi."
          exit 1
