name: Aggiornamento dati e pronostici

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_predictions.py"
      - "scripts/enrich_with_gemini.py"
      - "scripts/archive_predictions.py"
      - "tests/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: aggiornamento-pronostici
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica il modello con test automatici
        run: python -m unittest discover -s tests -v
      - name: Sincronizza, genera e salva i dati aggiornati
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Sincronizza prima con main per evitare conflitti quando il file dati
          # viene aggiornato da un'esecuzione precedente.
          git fetch origin main
          git reset --hard origin/main
          python scripts/update_predictions.py
          python scripts/enrich_with_gemini.py
          python scripts/archive_predictions.py
          git add data/predictions.json data/history.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento nei dati."
          else
            git commit -m "Aggiorna dati e pronostici calcistici"
            git push origin HEAD:main
          fi
