name: Aggiornamento dati e pronostici

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_predictions.py"
      - "scripts/sync_competitions.py"
      - "scripts/enrich_with_gemini.py"
      - "scripts/enrich_with_odds.py"
      - "scripts/enrich_with_api_football_odds.py"
      - "scripts/analyze_market_odds.py"
      - "scripts/enrich_with_availability.py"
      - "scripts/enrich_with_weather.py"
      - "scripts/archive_predictions.py"
      - "scripts/validate_published_data.py"
      - "app.js"
      - "index.html"
      - "tests/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: aggiornamento-pronostici-v2
  cancel-in-progress: true

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sincronizza con l'ultima versione di main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Verifica il modello con test automatici
        run: python -m unittest discover -s tests -v
      - name: Verifica sintassi JavaScript
        run: node --check app.js
      - name: Sincronizza, genera e salva i dati aggiornati
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FORCE_COMPETITION_SYNC: ${{ github.event_name == 'push' && github.event.head_commit.message != 'Aggiorna dati e pronostici calcistici' && '1' || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ricalcola su main aggiornato e riprova in caso di push concorrente.
          # Il lock di concorrenza riduce le collisioni; il retry evita che una
          # modifica manuale durante il calcolo perda l'aggiornamento automatico.
          for attempt in 1 2 3; do
            echo "Tentativo sincronizzazione $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            # Il calendario va sincronizzato dopo il reset, altrimenti git reset
            # eliminerebbe i dati appena scaricati nello step precedente.
            env -u API_FOOTBALL_KEY python scripts/sync_competitions.py
            python scripts/update_predictions.py
            python scripts/enrich_with_weather.py
            python scripts/enrich_with_availability.py
            python scripts/enrich_with_odds.py
            python scripts/enrich_with_api_football_odds.py
            python scripts/analyze_market_odds.py
            python scripts/enrich_with_gemini.py
            python scripts/archive_predictions.py
            python scripts/validate_published_data.py
            git add data/predictions.json data/history.json data/competition_data.json data/availability_cache.json data/odds_cache.json data/weather_cache.json
            if git diff --cached --quiet; then
              echo "Nessun cambiamento nei dati."
              exit 0
            fi
            git commit -m "Aggiorna dati e pronostici calcistici"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push concorrente: riprovo da main aggiornato."
          done
          echo "Impossibile pubblicare i dati dopo tre tentativi."
          exit 1
