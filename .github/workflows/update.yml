name: Aggiornamento dati e pronostici

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_predictions.py"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: aggiornamento-pronostici
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica il modello con test automatici
        run: python -m unittest discover -s tests -v
      - name: Scarica risultati e genera stime
        run: python scripts/update_predictions.py
      - name: Salva i dati aggiornati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento nei dati."
          else
            git commit -m "Aggiorna dati e pronostici calcistici"
            # Integra eventuali modifiche pubblicate mentre il calcolo era in corso.
            git pull --rebase origin main
            git push
          fi
