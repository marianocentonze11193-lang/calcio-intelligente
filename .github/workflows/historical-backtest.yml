name: Validazione storica modello e xG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test automatici
        run: python -m unittest discover -s tests -v
      - name: Controllo sintassi Python
        run: python -m py_compile scripts/*.py
      - name: Esegui backtest cronologico con confronto xG
        run: python scripts/backtest_walk_forward.py
      - name: Conserva report storico per revisione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validazione-storica-xg
          path: data/backtest_report.json
          if-no-files-found: warn
          retention-days: 14
