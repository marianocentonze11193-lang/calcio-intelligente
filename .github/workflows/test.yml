name: Test modello e interfaccia

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "app.js"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test automatici Python
        run: python -m unittest discover -s tests -v
      - name: Controllo sintassi di tutti gli script Python
        run: python -m py_compile scripts/*.py
      - name: Controllo sintassi JavaScript
        run: node --check app.js
      - name: Backtest cronologico e confronto storico xG
        run: python scripts/backtest_walk_forward.py
      - name: Carica il report del backtest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validazione-storica-xg
          path: data/backtest_report.json
          if-no-files-found: warn
          retention-days: 14
