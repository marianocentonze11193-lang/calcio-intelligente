name: Test modello e interfaccia

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "app.js"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test automatici Python
        run: python -m unittest discover -s tests -v
      - name: Controllo sintassi JavaScript
        run: node --check app.js
